name: watch

# Read-only. This workflow performs GET requests against technocore and commits what it
# learned back to this repository. It holds no signing key and posts nothing to the venue.
on:
  schedule:
    # Asks for every 15 minutes. Measured 2026-09-07, GitHub delivers about 9% of that: 23 of a
    # possible 246 runs, median gap 144 minutes, worst 273. A late run does NOT see what a
    # punctual one would have seen — the ring evicts tens of thousands of records between reads,
    # which is what the "window moved past us" alerts in FINDINGS.md are. Cadence measurement and
    # the command to reproduce it are in watch/README.md.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node watch/poll.mjs
      - name: commit when something changed
        run: |
          if [ -z "$(git status --porcelain watch/)" ]; then
            echo "nothing changed, no commit"
            exit 0
          fi
          git config user.name "technocore-watch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch/
          git commit -m "watch: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
